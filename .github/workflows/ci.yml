name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this whole file before publishing, then
  # publishes the `hardhooks-plugin` tarball the plugin job uploads.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: End-to-end tests (every test runs the bundled CLI)
        run: npm run test:e2e
      - run: npm test
      - name: Smoke tests (bundled CLI)
        run: npx vitest run --project smoke

  plugin:
    # The marketplace installs the plugin from the npm package (`npm` plugin
    # source), so validate the packed tarball users get, not the repo root.
    # The release workflow (release.yml) publishes this same tarball to npm.
    name: Claude Code plugin
    runs-on: ubuntu-latest
    env:
      # Pinned so validation rules change only when we bump this.
      CLAUDE_CODE_VERSION: 2.1.294
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate marketplace
        run: claude plugin validate --strict .claude-plugin/marketplace.json
      - name: Pack plugin
        run: |
          mkdir -p plugin-artifact
          npm pack --pack-destination plugin-artifact
          tar -xzf plugin-artifact/hardhooks-*.tgz -C plugin-artifact
      - name: Validate packed plugin
        run: claude plugin validate --strict plugin-artifact/package
      - uses: actions/upload-artifact@v7
        with:
          name: hardhooks-plugin
          path: plugin-artifact/*.tgz
          if-no-files-found: error
